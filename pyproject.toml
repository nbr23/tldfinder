[project]
name = "tldfinder"
version = "1.0"
description = "List TLDs available for registration for a specific name and their pricing at ovh.com"
readme = "README.md"
license = "MIT"
authors = [{ name = "nbr23", email = "max@23.tf" }]
requires-python = ">=3.10"
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com/nbr23/tldfinder"

[project.scripts]
tldfinder = "tldfinder.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
